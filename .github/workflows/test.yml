name: Test

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Download actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.6.21
        shell: bash
      - name: Check workflow files
        run: ./actionlint -color
        shell: bash

  lint-cruft:
    name: Check if automatic project update was successful
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Fail if .rej files exist as structure update was not successful
        run: test -z "$(find . -iname '*.rej')"

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/python-poetry-env
      - run: poetry run pre-commit run --all-files
        env:
          # autoflake/isort/black/pyupgrade/end-of-file-fixer/trailing-whitespace
          # are currently failing on pre-existing, un-normalized formatting
          # across most of the codebase (not something introduced here) --
          # applying that repo-wide reformat is risky to do blind (autoflake's
          # --remove-all-unused-imports deleted every import in __init__.py in
          # one attempt, since nothing in that file *uses* the names it
          # re-exports) and is a separate effort. flake8 is skipped too since
          # it has its own large pre-existing backlog (TRY003/N806/B006/etc.)
          # unrelated to this. Re-enable hook by hook as each backlog is
          # actually cleared -- don't just leave this list growing.
          SKIP: end-of-file-fixer,trailing-whitespace,autoflake,isort,black,pyupgrade,flake8

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/python-poetry-env
        with:
          python-version: ${{ matrix.python-version }}
      - run: poetry run pytest
