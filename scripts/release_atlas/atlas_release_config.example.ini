# Atlas release config -- see README.md for the full walkthrough.
#
# [data_info] is copied verbatim into atlas_config/<Data_Name> when you run
# promote_atlas.py, so use the exact same format/casing as existing files under
# cbig_network_correspondence_data/atlas_config/. Omit a key entirely (don't leave
# it blank) when it doesn't apply -- e.g. don't write "Data_Threshold:" with
# nothing after the colon, that will crash grab_data_info's parser. Look at an
# existing atlas_config file for your Data_Type for a template.

[data_info]
Data_Category: ExampleCat
Data_Name: EXAMPLEATLAS17
Data_Space: fs_LR_32k
Data_Type: Hard
Data_NetworkAssignment: False
# Data_Threshold: [0,Inf]   # only include this line for Soft/Metric atlases

[release_info]
# Human-readable name, appended to atlas_list_fullname alongside Data_Name in
# atlas_list -- required.
Data_FullName: Example Atlas, 17-network solution

# Path or glob to the atlas's native-space file(s):
#   - fs_LR_32k / fsaverage6 native (Hard only): exactly one .mat with
#     lh_labels/rh_labels
#   - FSLMNI2mm / LairdColin2mm / ShenColin1mm native: one .nii.gz, or a glob
#     matching several (e.g. for a multi-map soft atlas) -- each matched
#     filename must contain Data_Name as a substring, since that's how the
#     toolbox finds a given atlas's files later
Source_Files: /path/to/native/EXAMPLEATLAS17.mat

# Only used for FSLMNI2mm/LairdColin2mm/ShenColin1mm-native atlases -- semicolon
# separated, one entry per file matched by Source_Files, in natural-sorted (natsort) order --
# e.g. for zstat1..zstat12, that means zstat1,zstat2,...,zstat12, NOT the
# lexicographic zstat1,zstat10,zstat11,zstat12,zstat2,.... Not applied during
# staging (staged data stays continuous); all entries must be the same value,
# which gets written into Data_Threshold above for the toolbox to apply at
# runtime. Leave blank/omit if you'd rather just set Data_Threshold yourself.
Thresholds:

# Required: one network name per line (same order as the parcellation labels, or
# the sorted Source_Files for a multi-map Soft/Metric atlas), copied to
# network_names/<Data_Name>. Every atlas currently in cbig_network_correspondence_data
# has one of these -- it's what construct_network_name() reads at runtime.
Network_Names_File: /path/to/EXAMPLEATLAS17_network_names.txt

# Optional, only meaningful when Data_NetworkAssignment is true: a .mat with a
# "mapping" variable, copied to network_assignment/<Data_Name>.mat
Network_Assignment_File:
